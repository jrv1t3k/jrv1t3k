<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="Inter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D12"/>
      <stop offset="0.55" stop-color="#0F1720"/>
      <stop offset="1" stop-color="#15212D"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#2DD4BF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="traceFade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#9FDCEA" fill-opacity="0.065"/>
    </pattern>
    <mask id="fadeRight">
      <rect width="1200" height="320" fill="url(#traceFade)"/>
    </mask>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect x="640" width="560" height="320" fill="url(#glowFade)"/>

  <g mask="url(#fadeRight)" fill="none" stroke="#22D3EE" stroke-width="2.25"
     stroke-linecap="round" stroke-opacity="0.5">
    <path d="M1200 44 H1060 L1020 84 H896"/>
    <path d="M1200 92 H1108 L1068 132 H944"/>
    <path d="M1200 140 H1156 L1116 180 H992"/>
    <path d="M1200 196 H1070 L1030 236 H906"/>
    <path d="M1200 244 H1118 L1078 284 H954"/>
    <path d="M1176 0 V26"/>
  </g>

  <g mask="url(#fadeRight)" stroke="#2DD4BF" stroke-width="2.25" fill="#0B1118" stroke-opacity="0.85">
    <circle cx="896" cy="84" r="5.5"/>
    <circle cx="944" cy="132" r="5.5"/>
    <circle cx="992" cy="180" r="5.5"/>
    <circle cx="906" cy="236" r="5.5"/>
    <circle cx="954" cy="284" r="5.5"/>
    <circle cx="1176" cy="26" r="5.5"/>
  </g>

  <rect x="0" y="0" width="5" height="320" fill="url(#edge)"/>

  <text x="72" y="102" font-family="DejaVu Sans Mono" font-size="15" letter-spacing="3.2"
        fill="#22D3EE" fill-opacity="0.92">@jrv1t3k</text>

  <text x="70" y="172" font-family="Inter Display, Inter" font-size="70" font-weight="700"
        letter-spacing="-1.8" fill="#F3F8FC">Jiří Vítek</text>

  <rect x="72" y="198" width="98" height="3" rx="1.5" fill="url(#rule)"/>

  <text x="72" y="238" font-size="25" font-weight="500" letter-spacing="0.1"
        fill="#93A6B8">Kyberbezpečnost · IT správa · hardware</text>
</svg>
